# Stack "one_db" — dados do Nettcom ONE (Postgres puro + Redis). Sem Supabase.
#
# Portainer → Stacks → Add stack → nome: one_db → colar este arquivo.
# Variáveis de ambiente da stack (aba "Environment variables"):
#   POSTGRES_PASSWORD   senha forte do usuário "one"
#
# Pré-requisitos no servidor de dados (nettcom-db), uma vez:
#   docker volume create one_pgdata
#   docker volume create one_redis
# (padrão da casa: volumes externos pré-criados; a stack usa external: true)
#
# A rede "nettcom" já existe (overlay, attachable) e é compartilhada com o Traefik.
version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: one
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: one
      # UTF-8 / pt_BR para ordenação correta de nomes brasileiros
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    command: >
      postgres
        -c max_connections=200
        -c shared_buffers=512MB
        -c effective_cache_size=1536MB
        -c work_mem=8MB
        -c maintenance_work_mem=128MB
        -c wal_level=replica
        -c log_min_duration_statement=500
    volumes:
      - one_pgdata:/var/lib/postgresql/data
    networks: [nettcom]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U one -d one"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      placement:
        constraints: [node.hostname == nettcom-db]
      restart_policy: {condition: any, delay: 5s}
      resources:
        limits: {memory: 2G}

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - one_redis:/data
    networks: [nettcom]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      replicas: 1
      placement:
        constraints: [node.hostname == nettcom-db]
      restart_policy: {condition: any, delay: 5s}
      resources:
        limits: {memory: 384M}

volumes:
  one_pgdata:
    external: true
  one_redis:
    external: true

networks:
  nettcom:
    external: true
