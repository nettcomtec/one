# Stack "one_postgres" — Postgres 16 (pgvector) do Nettcom ONE.
# Volume criado pelo próprio Swarm no deploy.
# Variável da stack:            POSTGRES_PASSWORD
version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: one
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: one
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    command: >
      postgres
        -c max_connections=200
        -c shared_buffers=512MB
        -c effective_cache_size=1536MB
        -c work_mem=8MB
        -c maintenance_work_mem=128MB
        -c wal_level=replica
        -c log_min_duration_statement=500
    volumes:
      - one_pgdata:/var/lib/postgresql/data
    networks: [nettcom]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U one -d one"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      restart_policy: {condition: any, delay: 5s}
      resources:
        limits: {memory: 2G}

volumes:
  one_pgdata: {}

networks:
  nettcom:
    external: true
