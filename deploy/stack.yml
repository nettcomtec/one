# Stack "one" — aplicação Nettcom ONE. Uma imagem, dois serviços (api | worker).
#
# Portainer → Stacks → Add stack → nome: one → colar este arquivo.
# Em Registries, selecione o registro ghcr.io se a imagem for privada (ver deploy/README.md).
#
# Variáveis de ambiente da stack:
#   DB_PASSWORD    a mesma POSTGRES_PASSWORD da stack de dados
#   JWT_SECRET     string aleatória de 32+ bytes  (openssl rand -hex 32)
#   BASE_DOMAIN    nettcom.io   (tenants em <slug>.nettcom.io)
#   IMAGE          opcional; padrão ghcr.io/nettcomtec/one:latest
#
# A API roda as migrações no boot (ONE_MIGRATE_ON_STARTUP), com trava de advisory
# lock para 2 réplicas não colidirem — por isso NÃO há serviço "migrate" separado.
# Atualizar = só trocar a imagem dos serviços (webhook por serviço, ver README).
#
# Proxy: NPM na rede "nettcom" aponta para http://one_api:8000. Se o NPM não estiver
# nessa rede, descomente "ports" da api e aponte para http://<ip>:8010.
version: "3.9"

x-env: &app-env
  ONE_ENV: prod
  ONE_DEBUG: "false"
  ONE_DATABASE_URL: postgresql+asyncpg://one:${DB_PASSWORD}@postgres:5432/one
  ONE_REDIS_URL: redis://redis:6379/0
  ONE_JWT_SECRET: ${JWT_SECRET}
  ONE_BASE_DOMAIN: ${BASE_DOMAIN:-nettcom.io}

services:
  api:
    image: ${IMAGE:-ghcr.io/nettcomtec/one:latest}
    environment:
      <<: *app-env
      ONE_ROLE: api
      ONE_MIGRATE_ON_STARTUP: "true"
    networks: [nettcom]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    # ports:
    #   - target: 8000
    #     published: 8010
    #     protocol: tcp
    #     mode: ingress
    deploy:
      replicas: 2
      update_config:
        parallelism: 2        # nó único: atualiza as duas réplicas juntas (mais rápido)
        order: start-first
        failure_action: rollback
        delay: 2s
      rollback_config: {parallelism: 2, order: stop-first}
      restart_policy: {condition: any, delay: 5s}
      resources:
        limits: {memory: 512M}

  worker:
    image: ${IMAGE:-ghcr.io/nettcomtec/one:latest}
    environment:
      <<: *app-env
      ONE_ROLE: worker
    networks: [nettcom]
    deploy:
      replicas: 1
      update_config: {order: start-first, failure_action: rollback}
      restart_policy: {condition: any, delay: 5s}
      resources:
        limits: {memory: 512M}

networks:
  nettcom:
    external: true
