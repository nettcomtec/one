# Stack "one" — aplicação Nettcom ONE. Uma imagem, três papéis (migrate | api | worker).
#
# Portainer → Stacks → Add stack → nome: one → colar este arquivo.
# Marcar "Enable access control" como preferir e, em Registries, selecionar o
# registro ghcr.io (a imagem é privada — ver deploy/README.md).
#
# Variáveis de ambiente da stack:
#   IMAGE          ghcr.io/nettcomtec/one:latest   (ou :sha-xxxxxxx para fixar versão)
#   DB_PASSWORD    a mesma POSTGRES_PASSWORD da stack one_db
#   JWT_SECRET     string aleatória de 32+ bytes  (openssl rand -hex 32)
#   BASE_DOMAIN    nettcomone.com   (tenants em <slug>.nettcomone.com)
#
# Fluxo por deploy: "migrate" roda uma vez (restart none) e leva todos os schemas
# de tenant ao estado atual; "api" sobe atrás do Nginx Proxy Manager; "worker" processa a fila.
#
# Proxy: o NPM está na mesma rede overlay "nettcom", então o destino do proxy host
# é http://one_api:8000 (nome do serviço) — sem publicar porta no host.
# Se o NPM NÃO estiver na rede "nettcom", descomente o bloco "ports" da api e
# aponte o NPM para http://<ip-do-nettcom-app>:8010.
# Para atualizar: trocar IMAGE (ou manter :latest e "Pull and redeploy") → Update the stack.
version: "3.9"

x-env: &app-env
  ONE_ENV: prod
  ONE_DEBUG: "false"
  ONE_DATABASE_URL: postgresql+asyncpg://one:${DB_PASSWORD}@postgres:5432/one
  ONE_REDIS_URL: redis://redis:6379/0
  ONE_JWT_SECRET: ${JWT_SECRET}
  ONE_BASE_DOMAIN: ${BASE_DOMAIN:-nettcomone.com}

services:
  migrate:
    image: ${IMAGE}
    environment:
      <<: *app-env
      ONE_ROLE: migrate
    networks: [nettcom]
    deploy:
      replicas: 1
      placement:
        constraints: [node.hostname == nettcom-app]
      restart_policy:
        condition: none

  api:
    image: ${IMAGE}
    environment:
      <<: *app-env
      ONE_ROLE: api
    networks: [nettcom]
    # ports:
    #   - target: 8000
    #     published: 8010
    #     protocol: tcp
    #     mode: ingress
    deploy:
      replicas: 2
      placement:
        constraints: [node.hostname == nettcom-app]
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        delay: 10s
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy: {condition: any, delay: 5s}
      resources:
        limits: {memory: 512M}

  worker:
    image: ${IMAGE}
    environment:
      <<: *app-env
      ONE_ROLE: worker
    networks: [nettcom]
    deploy:
      replicas: 1
      placement:
        constraints: [node.hostname == nettcom-app]
      restart_policy: {condition: any, delay: 5s}
      resources:
        limits: {memory: 512M}

networks:
  nettcom:
    external: true
