name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: one
          POSTGRES_PASSWORD: one
          POSTGRES_DB: one
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U one"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ONE_TEST_DATABASE_URL: postgresql+asyncpg://one:one@localhost:5432/one
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q   # inclui o fluxo web end-to-end contra Postgres

  build-and-push:
    # Build the single image and push it. Swarm/Portainer then deploys it.
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Deploy automático no Swarm: dispara o webhook da stack "one" no Portainer,
      # que re-puxa a imagem :latest e redeploya. Pulado enquanto o secret não existir,
      # então não quebra o build antes do setup único (ver deploy/README.md).
      - name: Redeploy no Swarm via Portainer
        if: github.ref == 'refs/heads/main' && env.HOOK != ''
        env:
          HOOK: ${{ secrets.PORTAINER_WEBHOOK }}
        run: curl -fsS -X POST "$HOOK" && echo "Deploy disparado."
